# Dograh demo reverse proxy — single origin for UI, API (incl. WebSockets) and audio.

server {
    listen 80;
    server_name _;

    # Backend API and WebSockets (telephony media, agent streams).
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSockets (audio streaming)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 100M;
    }

    # Next.js UI
    location / {
        proxy_pass http://ui:3010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite localhost MinIO URLs in API responses to the proxy origin
        sub_filter 'http://localhost:9000/voice-audio/' 'http://localhost:8080/voice-audio/';
        sub_filter_once off;
        sub_filter_types application/json text/html;
    }

    # Call recordings / generated audio served from MinIO
    location /voice-audio/ {
        proxy_pass http://minio:9000/voice-audio/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        client_max_body_size 100M;
    }
}
